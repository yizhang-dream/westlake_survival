name: CI

# 离线门：不碰校园网与凭据，只验安装、CLI、离线检查与精选 pytest。
# module_smoke.py 默认精选集（匿名+离线）不需要凭据。
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  offline-gate:
    name: offline gate · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      TZ: "Asia/Shanghai"
      PYTHONUTF8: "1"
      # 强制 zoneinfo 使用 Python tzdata 包，防止 Linux 系统时区库掩盖问题。
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (constrained to reviewed dependency snapshot)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.txt -e ".[test]" ruff
          python -m pip check

      - name: Verify constrained dependency versions
        run: |
          python -c "import importlib.metadata as m; from pathlib import Path; pins = dict(line.strip().split('==', 1) for line in Path('requirements.txt').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#') and '==' in line); assert m.version('pytest') == pins['pytest'], (m.version('pytest'), pins['pytest']); assert m.version('tzdata') == pins['tzdata'], (m.version('tzdata'), pins['tzdata'])"

      - name: Collect non-live pytest tests
        run: python -m pytest --collect-only -q

      - name: Offline regression tests
        run: |
          python -m pytest -q src/test/canvas/test_models.py src/test/pms/test_pms_models.py src/test/ical src/test/transit/test_ical.py src/test/transit/test_schedule.py src/test/calendar/test_calendar_fallback.py

      - name: Static check (undefined names)
        run: ruff check --select F821 src

      - name: CLI boots
        run: westlake --help

      - name: Offline smoke
        run: python tools/module_smoke.py --offline

      - name: SKILL and CLI agree
        run: python tools/skill_coverage.py .

      - name: PII gate (scanner exit semantics tracked separately)
        run: python tools/pii_scan.py
