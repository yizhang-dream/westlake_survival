name: Release

# 构建 sdist+wheel 并发布到 PyPI。手动触发（workflow_dispatch）或推 v* 标签。
# 凭据用仓库加密 secret PYPI_API_TOKEN（pypa/gh-action-pypi-publish）；
# 后续可切 PyPI trusted publishing（OIDC 免 token），届时去掉 password 换
# id-token: write 即可。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
