[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "westlake_survival"
dynamic = ["version"]
description = "API-level access to Westlake University services — 在 API 层面调用西湖大学各服务系统"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "westlake_survival contributors" }]
keywords = ["westlake", "university", "sis", "canvas", "library", "westlake-survival"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28",
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
    "tzdata>=2024.1",
    # 统一身份认证（IAM）用 RSA 加密密码；缺了它会退回 PeopleSoft 本地登录
    # 并显示成「用户名或密码错误」，新设备装完即不可用，故列为必需依赖。
    "cryptography>=42",
    # 前端是默认入口（裸 `westlake`/双击脚本都直接开网页「设置」），
    # 所以 Flask 也是必需依赖：装完即可用，不留「装了却打不开页面」的缺口。
    "flask>=3.0",
]

[project.optional-dependencies]
# 兼容旧装法：Flask 已在必需依赖里，这里重复列出只为让 `pip install -e '.[webui]'` 照常工作。
webui = ["flask>=3.0"]
test = ["pytest>=8.0"]
secure = ["keyring>=25"]
# 兼容旧装法：cryptography 已在必需依赖里，这里重复列出只为让旧命令照常工作。
crypto = ["cryptography>=42"]

[project.scripts]
westlake = "westlake_survival.cli:cli"
westlake-mcp = "westlake_survival.mcp_server:main"

[project.urls]
Reference = "https://github.com/dumixthestpd/sustech_survival"

[tool.hatch.version]
path = "src/westlake_survival/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/westlake_survival"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
markers = [
    "live: tests requiring campus network and/or a valid session (excluded by default)",
    "e2e: 端到端用例（真实进程/真实链路），验证口径以它为准",
]
addopts = "-m 'not live' --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["westlake_survival"]
