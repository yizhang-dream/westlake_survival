<!DOCTYPE html>
<html><head><meta charset='utf-8'><title>合成 label-value fixture</title></head><body>
<!-- 合成 fixture（非真实页面）：字段名与取值均为构造值（*** = 脱敏占位），
     覆盖 label-value 配对、空标签、无值标签、含 <br /> 的多行值。 -->
<DIV class='ps_box-group' id='win0divPROFILE_GROUPBOX'>
  <DIV class='ps_box-edit psc_disabled psc_has_value' id='win0divPROFILE_ID'>
    <DIV class='ps_box-label' id='win0divPROFILE_IDlbl'><span class='ps-label'>Student ID</span></DIV>
    <span class='ps_box-value' id='PROFILE_ID' >***</span>
  </DIV>
  <DIV class='ps_box-edit psc_disabled psc_has_value' id='win0divPROFILE_NAME'>
    <DIV class='ps_box-label' id='win0divPROFILE_NAMElbl'><span class='ps-label'>Name</span></DIV>
    <span class='ps_box-value' id='PROFILE_NAME' >***</span>
  </DIV>
  <DIV class='ps_box-edit psc_disabled psc_has_value' id='win0divPROFILE_PROGRAM'>
    <DIV class='ps_box-label' id='win0divPROFILE_PROGRAMlbl'><span class='ps-label'>Program</span></DIV>
    <span class='ps_box-value' id='PROFILE_PROGRAM' >Test Program</span>
  </DIV>
  <DIV class='ps_box-edit psc_disabled psc_has_value' id='win0divPROFILE_EMPTY'>
    <DIV class='ps_box-label' id='win0divPROFILE_EMPTYlbl'><span class='ps-label'>Advisor</span></DIV>
    <span class='ps_box-value' id='PROFILE_EMPTY' >&nbsp;</span>
  </DIV>
  <DIV class='ps_box-edit psc_disabled' id='win0divPROFILE_NOLABEL'>
    <DIV class='ps_box-label' id='win0divPROFILE_NOLABELlbl'><span class='ps-label'>&nbsp;</span></DIV>
    <span class='ps_box-value' id='PROFILE_NOLABEL' >orphan value</span>
  </DIV>
  <DIV class='ps_box-longedit psc_disabled psc_has_value' id='win0divPROFILE_ADDR'>
    <DIV class='ps_box-label' id='win0divPROFILE_ADDRlbl'><span class='ps-label'>Address</span></DIV>
    <span class='ps_box-value' id='PROFILE_ADDR' >Line 1<br />Line 2</span>
  </DIV>
</DIV>
</body></html>
