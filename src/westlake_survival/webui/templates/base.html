<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}西湖生存手册{% endblock %}</title>
<style>
  :root {
    --bg: #f5f7f9;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7684;
    --line: #e3e8ee;
    --accent: #0b6e4f;
    --accent-soft: #e6f2ee;
    --warn: #b45309;
    --warn-soft: #fdf3e3;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.55;
    font-size: 15px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.topbar {
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }
  .topbar .wrap {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
    height: 60px;
  }
  .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
  .brand .dot { color: var(--accent); }
  nav.main { display: flex; gap: 1.1rem; }
  nav.main a { color: var(--muted); font-size: .92rem; }
  nav.main a.active { color: var(--accent); font-weight: 600; }
  main { padding: 1.75rem 0 3rem; }
  h1.page { font-size: 1.35rem; margin: 0 0 1.1rem; }
  h2.section {
    font-size: 1rem; margin: 1.75rem 0 .75rem; color: var(--muted);
    font-weight: 600; letter-spacing: .02em;
  }
  .grid { display: grid; gap: .9rem; }
  .grid.cols-4 { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .grid.cols-2 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1rem 1.1rem;
  }
  .card .label {
    font-size: .78rem; color: var(--muted); text-transform: none;
    letter-spacing: .03em;
  }
  .card .value { font-size: 1.35rem; font-weight: 650; margin-top: .25rem; }
  .card .value.small { font-size: 1rem; font-weight: 500; }
  .card.hero .value { font-size: 2.1rem; }
  .muted { color: var(--muted); }
  .dim { color: #a7b0ba; }
  table.data {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; font-size: .9rem;
  }
  table.data th, table.data td {
    text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.data th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  table.data tr:last-child td { border-bottom: none; }
  table.data td.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data td.time.hl { color: var(--accent); font-weight: 650; }
  .chip {
    display: inline-block; padding: .12rem .55rem; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: .78rem;
    font-weight: 600;
  }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .note {
    background: var(--warn-soft); color: var(--warn); border: 1px solid #f4dfbc;
    border-radius: var(--radius); padding: .7rem .9rem; font-size: .88rem;
    margin-bottom: 1rem;
  }
  .progress {
    background: #e9edf1; border-radius: 999px; height: 10px; overflow: hidden;
    margin-top: .5rem;
  }
  .progress > span {
    display: block; height: 100%; background: var(--accent); border-radius: 999px;
  }
  .kv { display: flex; flex-wrap: wrap; gap: 1.5rem; }
  .kv > div { min-width: 8rem; }
  .empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
  form.filter {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: .8rem;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .8rem 1rem; margin-bottom: 1.1rem;
  }
  form.filter label {
    display: flex; flex-direction: column; gap: .25rem;
    font-size: .78rem; color: var(--muted);
  }
  form.filter select, form.filter input {
    font: inherit; font-size: .9rem; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: .35rem .55rem;
    min-width: 12rem;
  }
  form.filter button {
    font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: .42rem 1rem;
  }
  form.filter button:hover { background: #0a5e44; }
  footer {
    color: var(--muted); font-size: .8rem; padding: 1.5rem 0;
    border-top: 1px solid var(--line); margin-top: 2rem;
  }
  code { background: #eef1f4; padding: .08rem .35rem; border-radius: 4px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">西湖生存手册<span class="dot">·</span>Web</div>
    <nav class="main">
      {% set here = request.path %}
      <a href="/" class="{{ 'active' if here == '/' else '' }}">仪表盘</a>
      <a href="/shuttle" class="{{ 'active' if here.startswith('/shuttle') else '' }}">班车</a>
      <a href="/calendar" class="{{ 'active' if here.startswith('/calendar') else '' }}">校历</a>
      <a href="/events" class="{{ 'active' if here.startswith('/events') else '' }}">讲座活动</a>
      <a href="/faculty" class="{{ 'active' if here.startswith('/faculty') else '' }}">教师</a>
      <a href="/news" class="{{ 'active' if here.startswith('/news') else '' }}">新闻</a>
      <a href="/program" class="{{ 'active' if here.startswith('/program') else '' }}">培养方案</a>
      <a href="/courses" class="{{ 'active' if here.startswith('/courses') else '' }}">通识课程</a>
      <a href="/map" class="{{ 'active' if here.startswith('/map') else '' }}">地图</a>
      <a href="/capabilities" class="{{ 'active' if here.startswith('/capabilities') else '' }}">能力</a>
      <a href="/dining" class="{{ 'active' if here.startswith('/dining') else '' }}">餐饮</a>
      <a href="/search" class="{{ 'active' if here.startswith('/search') else '' }}">搜索</a>
      <a href="/api/context">API</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap">
    本地工具，仅绑定 <code>127.0.0.1</code>，无登录 / 鉴权。
    数据来自公开页面，可能有延迟；以学校官方通知为准。
  </div>
</footer>
</body>
</html>
